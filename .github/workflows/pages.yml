name: Pages — mapa 3D
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      model_sha: ${{ steps.artifact.outputs.model_sha }}
      publication_sha: ${{ steps.artifact.outputs.publication_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Resolve latest once or restore this run's inputs
        run: |
          mkdir -p .build
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            python scripts/catalog.py resolve --output .build/inputs.json
          else
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "inputs-$GITHUB_RUN_ID" --dir .build
            python scripts/catalog.py resolve --output .build/inputs.json
          fi
      - name: Preserve the exact inputs before fetching data
        if: github.run_attempt == 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inputs-${{ github.run_id }}
          path: .build/inputs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Tests
        run: |
          python -m unittest discover -s tests
          node --check app/jktz.js
      - name: Build the complete static site
        run: |
          python scripts/catalog.py build --inputs .build/inputs.json --cache .build/catalog --output .build/caves.json
          python scripts/terrain.py fetch --manifest data/terrain.json --cache .build/terrain --output dist/data
          python scripts/terrain.py coverage --terrain-dir dist/data --caves .build/caves.json --output dist/data/coverage.json
          python scripts/site.py build
          python scripts/site.py verify
      - name: Name the verified Pages artifact
        id: artifact
        run: |
          echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "model_sha=$(sha256sum dist/data/caves.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "publication_sha=$(sha256sum dist/publication.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist
          include-hidden-files: true
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Confirm the public commit and Range transport
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GH_TOKEN: ${{ github.token }}
          MODEL_SHA: ${{ needs.build.outputs.model_sha }}
          PUBLICATION_SHA: ${{ needs.build.outputs.publication_sha }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "inputs-$GITHUB_RUN_ID" --dir .build
          python3 scripts/confirm_public.py --url "$PAGE_URL" --commit "$GITHUB_SHA" --inputs .build/inputs.json --model-sha "$MODEL_SHA" --publication-sha "$PUBLICATION_SHA"
